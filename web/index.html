<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="360 Ghar: verified homes in Gurugram. Swipe through listings, walk in with a 360° tour, and book a visit.">
  <meta name="keywords" content="real estate, property search, 360 tours, virtual tours, property listings, house hunting, apartment search, home buying">
  
  <!-- Preload critical images -->
  <link rel="preload" as="image" href="icons/Icon-192.png">
  <link rel="preload" as="image" href="favicon.png">
  
  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ghar360">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  
  <!-- Android PWA -->
  <meta name="theme-color" content="#DDEFE9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0F2826" media="(prefers-color-scheme: dark)">
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  
  <!-- Image optimization hints -->
  <meta name="image-optimization" content="webp,avif">

  <!-- MapLibre GL JS (required for maplibre_gl on Flutter web) -->
  <script src="https://unpkg.com/maplibre-gl@^5.24.0/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@^5.24.0/dist/maplibre-gl.css" rel="stylesheet" />

  <!-- Loading Screen Management -->
  <script>
    // Hide loading screen when Flutter loads
    function hideLoadingScreen() {
      const loadingElement = document.getElementById('loading');
      if (loadingElement && loadingElement.style.display !== 'none') {
        console.log('Hiding loading screen...');
        loadingElement.style.opacity = '0';
        loadingElement.style.transition = 'opacity 0.5s ease-out';
        setTimeout(() => {
          loadingElement.style.display = 'none';
          console.log('Loading screen hidden');
        }, 500);
      }
    }

    // Multiple approaches to detect when Flutter is ready
    let isHidden = false;
    
    function tryHideLoadingScreen() {
      if (!isHidden) {
        isHidden = true;
        hideLoadingScreen();
      }
    }

    // Method 1: Listen for Flutter-specific events
    window.addEventListener('flutter-first-frame', tryHideLoadingScreen);
    
    // Method 2: Check for Flutter DOM elements
    function checkForFlutterElements() {
      const flutterElements = document.querySelectorAll('flt-glass-pane, flutter-view, [flt-renderer], .flt-glass-pane');
      if (flutterElements.length > 0) {
        console.log('Flutter elements detected');
        tryHideLoadingScreen();
        return true;
      }
      return false;
    }
    
    // Method 3: MutationObserver to watch for DOM changes
    if (typeof MutationObserver !== 'undefined') {
      const observer = new MutationObserver(function(mutations) {
        if (checkForFlutterElements()) {
          observer.disconnect();
        }
      });
      
      document.addEventListener('DOMContentLoaded', function() {
        observer.observe(document.body, {
          childList: true,
          subtree: true,
          attributes: true
        });
      });
    }
    
    // Method 4: Polling for Flutter elements
    let pollCount = 0;
    const pollInterval = setInterval(() => {
      pollCount++;
      if (checkForFlutterElements() || pollCount > 40) { // Stop after 20 seconds
        clearInterval(pollInterval);
      }
    }, 500);
    
    // Method 5: Fallback timeout
    setTimeout(() => {
      console.log('Fallback timeout triggered');
      tryHideLoadingScreen();
    }, 5000);
  </script>
  
  <title>Ghar360 - Real Estate with 360° Tours</title>
  <link rel="manifest" href="manifest.json">
  
  <style>
    /* The page itself carries the app's page tone, so nothing flashes white
       between the loader and the first Flutter frame. */
    html, body { margin: 0; background: #DDEFE9; }
    @media (prefers-color-scheme: dark) { html, body { background: #0F2826; } }

    /* Loading screen: the app's page tone (sky paper) with the bare logo mark,
       so the first Flutter frame paints the same colour. */
    #loading {
      position: fixed;
      inset: 0;
      background: #DDEFE9;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .loading-logo {
      width: 72px;
      height: 72px;
      margin-bottom: 20px;
      background: url('assets/assets/icons/logo_mark.png') center / contain no-repeat;
    }

    .loading-spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(12, 106, 97, 0.18);
      border-top-color: #0C6A61;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin-bottom: 14px;
    }

    .loading-text {
      color: #4B5955;
      font-size: 15px;
      font-weight: 600;
    }

    @media (prefers-color-scheme: dark) {
      #loading { background: #0F2826; }
      .loading-logo { background-image: url('assets/assets/icons/logo_mark_dark.png'); }
      .loading-spinner { border-color: rgba(92, 196, 182, 0.2); border-top-color: #5CC4B6; }
      .loading-text { color: #B6C5C0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .loading-spinner { animation: none; }
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Hide loading screen when Flutter app loads */
    .flutter-loaded #loading {
      display: none;
    }
  </style>
</head>
<body>
  <!-- Loading Screen -->
  <div id="loading">
    <div class="loading-logo" role="img" aria-label="360 Ghar"></div>
    <div class="loading-spinner"></div>
    <div class="loading-text">Loading 360 Ghar</div>
  </div>
  
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
