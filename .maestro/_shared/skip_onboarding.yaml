appId: com.the360ghar.ghar360
---
# launch_clean starts onboarding. Fail if it cannot reach the unified entry form.
- extendedWaitUntil:
    visible:
      id: qa.splash.skip
    timeout: 20000
- tapOn:
    id: qa.splash.skip
- extendedWaitUntil:
    visible:
      id: qa.auth.phone_entry.identifier_input
    timeout: 20000
