appId: com.the360ghar.ghar360
---
- runFlow: ../_shared/launch_clean.yaml
- runFlow: ../_shared/skip_onboarding.yaml
- runFlow:
    when:
      visible:
        id: qa.auth.login.password_input
    commands:
      - tapOn: "Change"
- extendedWaitUntil:
    visible:
      id: qa.auth.phone_entry.identifier_input
    timeout: 20000
- tapOn:
    id: qa.auth.phone_entry.identifier_input
- inputText: "${TEST_NEW_IDENTIFIER}"
- runFlow: ../_shared/dismiss_auth_keyboard.yaml
- scrollUntilVisible:
    element:
      id: qa.auth.phone_entry.continue
- tapOn:
    id: qa.auth.phone_entry.continue
- extendedWaitUntil:
    visible:
      id: qa.auth.signup.next
    timeout: 20000
- runFlow: ../_shared/dismiss_auth_keyboard.yaml
- scrollUntilVisible:
    element:
      id: qa.auth.signup.next
- tapOn:
    id: qa.auth.signup.next
- assertVisible: "Full name is required"
