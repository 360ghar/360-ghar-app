appId: com.the360ghar.ghar360
---
- runFlow: ../_shared/launch_clean.yaml
- runFlow: ../_shared/skip_onboarding.yaml
- runFlow:
    when:
      visible:
        id: qa.auth.login.password_input
    commands:
      - tapOn: "Change"
- extendedWaitUntil:
    visible:
      id: qa.auth.phone_entry.identifier_input
    timeout: 20000
- runFlow: ../_shared/dismiss_auth_keyboard.yaml
- scrollUntilVisible:
    element:
      id: qa.auth.phone_entry.continue
- tapOn:
    id: qa.auth.phone_entry.continue
- assertVisible: "Please enter your email or phone number"
- tapOn:
    id: qa.auth.phone_entry.identifier_input
- inputText: "1234"
- runFlow: ../_shared/dismiss_auth_keyboard.yaml
- scrollUntilVisible:
    element:
      id: qa.auth.phone_entry.continue
- tapOn:
    id: qa.auth.phone_entry.continue
- assertVisible: "Enter a valid email or phone number"
