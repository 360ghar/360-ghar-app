appId: com.the360ghar.ghar360
---
- runFlow: ../_shared/launch_clean.yaml
- extendedWaitUntil:
    visible:
      id: qa.splash.next
    timeout: 20000
- tapOn:
    id: qa.splash.next
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: qa.splash.next
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: qa.splash.get_started
- extendedWaitUntil:
    visible:
      id: qa.auth.phone_entry.identifier_input
    timeout: 20000
- assertVisible:
    id: qa.auth.phone_entry.continue
