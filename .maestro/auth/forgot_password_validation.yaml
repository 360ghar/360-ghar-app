appId: com.the360ghar.ghar360
---
- runFlow: ../_shared/launch_clean.yaml
- runFlow: ../_shared/skip_onboarding.yaml
- runFlow:
    when:
      visible:
        id: qa.auth.login.password_input
    commands:
      - tapOn: "Change"
- extendedWaitUntil:
    visible:
      id: qa.auth.phone_entry.identifier_input
    timeout: 20000
- tapOn:
    id: qa.auth.phone_entry.identifier_input
- inputText: "${TEST_PHONE}"
- runFlow: ../_shared/dismiss_auth_keyboard.yaml
- scrollUntilVisible:
    element:
      id: qa.auth.phone_entry.continue
- tapOn:
    id: qa.auth.phone_entry.continue
- extendedWaitUntil:
    visible:
      id: qa.auth.login.password_input
    timeout: 20000
- tapOn:
    id: qa.auth.login.forgot_password
- extendedWaitUntil:
    visible:
      id: qa.auth.forgot_password.submit
    timeout: 15000
- tapOn:
    id: qa.auth.forgot_password.identifier_input
- eraseText
- runFlow: ../_shared/dismiss_auth_keyboard.yaml
- scrollUntilVisible:
    element:
      id: qa.auth.forgot_password.submit
- tapOn:
    id: qa.auth.forgot_password.submit
- assertVisible: "Please enter your email or phone number"
