appId: com.the360ghar.ghar360
---
- runFlow: ../_shared/login.yaml
- tapOn:
    id: qa.dashboard.nav.profile
- tapOn:
    id: qa.profile.menu.preferences
- extendedWaitUntil:
    visible:
      id: qa.profile.preferences.screen
    timeout: 15000
- scrollUntilVisible:
    element:
      id: qa.profile.preferences.theme_selector
- tapOn:
    id: qa.profile.preferences.theme_selector
- assertVisible: "Light Mode"
- assertVisible: "Dark Mode"
- assertVisible: "System Mode"
- tapOn: "Cancel"
- assertVisible:
    id: qa.profile.preferences.screen
- scrollUntilVisible:
    element:
      id: qa.profile.preferences.language_selector
- tapOn:
    id: qa.profile.preferences.language_selector
- assertVisible: "English"
- assertVisible: "हिंदी"
- tapOn: "Cancel"
- assertVisible:
    id: qa.profile.preferences.screen
