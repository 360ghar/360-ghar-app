appId: com.the360ghar.ghar360
---
- runFlow: ../_shared/login.yaml
- tapOn:
    id: qa.dashboard.nav.profile
- scrollUntilVisible:
    element:
      id: qa.profile.menu.help
- tapOn:
    id: qa.profile.menu.help
- extendedWaitUntil:
    visible:
      id: qa.profile.help.screen
    timeout: 15000
- scrollUntilVisible:
    element:
      id: qa.profile.help.send_feedback
- tapOn:
    id: qa.profile.help.send_feedback
- extendedWaitUntil:
    visible:
      id: qa.profile.feedback.screen
    timeout: 15000
- scrollUntilVisible:
    element:
      id: qa.profile.feedback.submit
- tapOn:
    id: qa.profile.feedback.submit
- scrollUntilVisible:
    element:
      text: "Please describe the issue in a short title"
    direction: UP
- assertVisible: "Please describe the issue in a short title"
- scrollUntilVisible:
    element:
      text: "Please provide a short description of the problem"
- assertVisible: "Please provide a short description of the problem"
