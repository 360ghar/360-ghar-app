name: ghar360
description: A Flutter real estate app with Bumble-inspired design using GetX
publish_to: 'none'
version: 1.0.7+12

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.9
  get: ^4.6.6
  get_storage: ^2.1.1
  http: ^1.2.2
  supabase_flutter: ^2.16.0
  json_annotation: ^4.12.0
  shared_preferences: ^2.5.5
  connectivity_plus: ^7.2.0
  google_fonts: ^8.1.0
  cached_network_image: ^3.4.1
  chewie: ^1.14.1
  flutter_svg: ^2.3.0
  intl: ^0.20.2
  geolocator: ^14.0.3
  geocoding: ^5.0.0
  maplibre_gl: ^0.26.2
  logger: ^2.7.0
  flutter_rating_bar: ^4.0.1
  shimmer: ^3.0.0
  webview_flutter: ^4.14.1
  webview_flutter_web: ^0.2.2+4
  webview_flutter_android: ^4.13.0
  image_network: ^2.1.2
  flutter_cache_manager: ^3.4.1
  url_launcher: ^6.3.0
  image_picker: ^1.2.3
  flutter_markdown: ^0.7.3
  package_info_plus: ^10.2.0
  universal_io: ^2.2.2
  flutter_staggered_grid_view: ^0.7.0
  photo_view: ^0.15.0
  video_player: ^2.12.0

  # Firebase Core + services (minimal, opt-in collection)
  firebase_core: ^4.11.0
  firebase_crashlytics: ^5.2.4
  firebase_analytics: ^12.4.3
  firebase_messaging: ^16.4.1
  firebase_performance: ^0.11.4+3
  firebase_remote_config: ^6.5.3
  firebase_in_app_messaging: ^0.9.2+4
  firebase_app_check: ^0.4.5
  # Local notifications for foreground FCM and app UX
  flutter_local_notifications: ^22.0.1
  # Native share sheets (Android/iOS/macOS/Web)
  share_plus: ^13.2.0

  # Deep linking via native App Links / Universal Links
  app_links: ^7.2.1

  meta: ^1.16.0
  in_app_update: ^5.0.0

  # Authentication: native Google Sign-In (ID-token flow) + nonce hashing
  google_sign_in: ^7.2.0
  crypto: ^3.0.7
  # Android phone-number hint picker (gated to Platform.isAndroid)
  smart_auth: ^3.2.0
  # SMS OTP autofill (CodeAutoFill mixin) — same major as 360-flatmates
  sms_autofill: ^2.3.0
  # Sign in with Apple (iOS App Store compliance; native ID-token flow)
  sign_in_with_apple: ^8.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  json_serializable: ^6.14.0
  import_sorter: ^4.6.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  mocktail: ^1.0.0

  path_provider_platform_interface: ^2.1.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    # Intentionally NO .env.* assets. Secrets must not ship in the AssetBundle.
    # Use --dart-define / --dart-define-from-file (see tool/run_with_env.sh).

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"

# Native launch screen configuration.
# Background colors match the app's first Flutter frame (Scaffold background)
# to avoid a color flash on cold start:
#   light -> AppDesignTokens.neutral50  (0xFFF9FAFB)
#   dark  -> AppDesignTokens.neutral900 (0xFF121417)
flutter_native_splash:
  color: "f9fafb"
  # Padded splash mark (not full-bleed app icon) so iOS/Android launch
  # screens show a centered logo instead of a zoomed full-screen image.
  image: assets/icons/splash_logo.png
  color_dark: "121417"
  image_dark: assets/icons/splash_logo.png
  ios: true
  android: true
  web: false
  android_12:
    color: "f9fafb"
    image: assets/icons/splash_logo.png
    color_dark: "121417"
    image_dark: assets/icons/splash_logo.png
