name: Lint & Format

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.6'
          cache: true

      - name: Verify Flutter and Dart versions
        run: |
          echo "Flutter version: $(flutter --version)"
          echo "Dart version: $(dart --version)"
          dart_version=$(dart --version 2>&1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "Dart version extracted: $dart_version"

          if [ -z "$dart_version" ]; then
            echo "❌ Failed to extract Dart version from 'dart --version' output"
            exit 1
          fi

          # Check if Dart version is >= 3.12.0 (matches pubspec.yaml constraint)
          if [ "$(printf '%s\n' "$dart_version" "3.12.0" | sort -V | head -n1)" = "3.12.0" ]; then
            echo "✅ Dart version $dart_version is compatible (≥3.12.0)"
          else
            echo "❌ Dart version $dart_version is incompatible (<3.12.0)"
            exit 1
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format -o none --set-exit-if-changed .

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test --machine --coverage

      - name: Run integration-style critical flow tests
        run: flutter test test/integration/

      - name: Enforce coverage threshold
        env:
          # Hard gate: overall line coverage must stay at or above this percent.
          # Raise gradually as suite depth improves; do not lower without review.
          # Ratcheted after coverage push (local suite measured ~90%).
          # Keep a buffer below 90 so CI hardware noise does not flake merges.
          MIN_LINE_PCT: "85"
        run: |
          set -euo pipefail
          if [ ! -f coverage/lcov.info ]; then
            echo "coverage/lcov.info missing after flutter test --coverage" >&2
            exit 1
          fi
          python3 - <<'PY'
          import os, sys
          min_pct = float(os.environ.get("MIN_LINE_PCT", "45"))
          lf = lh = 0
          with open("coverage/lcov.info", encoding="utf-8", errors="replace") as f:
              for line in f:
                  if line.startswith("LF:"):
                      lf += int(line.split(":", 1)[1])
                  elif line.startswith("LH:"):
                      lh += int(line.split(":", 1)[1])
          if lf == 0:
              print("No line coverage data found in lcov.info", file=sys.stderr)
              sys.exit(1)
          pct = 100.0 * lh / lf
          print(f"Line coverage: {pct:.2f}% ({lh}/{lf}) — threshold {min_pct:.0f}%")
          if pct + 1e-9 < min_pct:
              print(f"FAIL: coverage {pct:.2f}% is below {min_pct:.0f}%", file=sys.stderr)
              sys.exit(1)
          print("Coverage threshold met.")
          PY

      - name: Upload coverage to Codecov
        if: github.event_name == 'push' && secrets.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: true

      - name: Skip Codecov upload (no token)
        if: github.event_name == 'push' && secrets.CODECOV_TOKEN == ''
        run: echo "CODECOV_TOKEN is not set; skipping Codecov upload."
