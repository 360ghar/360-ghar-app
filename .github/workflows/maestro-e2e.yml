name: Maestro E2E

on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  maestro-android:
    name: Maestro Android E2E
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.6'
          cache: true

      - name: Create dart-define config
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          def env(key, default=""):
              v = os.environ.get(key)
              return default if v is None or v == "" else v
          payload = {
              "API_BASE_URL": env("API_BASE_URL", "https://api.360ghar.com"),
              "SUPABASE_URL": env("SUPABASE_URL"),
              "SUPABASE_PUBLISHABLE_KEY": env("SUPABASE_PUBLISHABLE_KEY"),
              "GOOGLE_PLACES_API_KEY": env("GOOGLE_PLACES_API_KEY"),
              "GOOGLE_WEB_CLIENT_ID": env("GOOGLE_WEB_CLIENT_ID"),
              "GOOGLE_IOS_CLIENT_ID": env("GOOGLE_IOS_CLIENT_ID"),
              "DEBUG_MODE": "true",
              "LOG_API_CALLS": "false",
              "FIREBASE_ANALYTICS": "false",
              "FIREBASE_PERFORMANCE": "false",
              "FIREBASE_IAM": "false",
          }
          with open("dart_defines.json", "w", encoding="utf-8") as f:
              json.dump(payload, f)
          print("dart_defines.json written (values not printed)")
          PY

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | MAESTRO_VERSION=1.39.0 bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH
          $HOME/.maestro/bin/maestro --version

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android emulator + Maestro tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          TEST_PHONE: ${{ secrets.TEST_PHONE }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        with:
          # API 30 + default target is more reliably cached on ubuntu runners than
          # API 34 google_apis (which failed with a corrupt system-image zip).
          api-level: 30
          arch: x86_64
          profile: pixel_6
          target: default
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            ./scripts/run_maestro_ci.sh android full

      - name: Upload Android Maestro artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-android-artifacts
          path: |
            build/maestro
            ~/.maestro/tests
          if-no-files-found: warn

  maestro-ios:
    name: Maestro iOS E2E
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.6'
          cache: true

      - name: Create dart-define config
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          def env(key, default=""):
              v = os.environ.get(key)
              return default if v is None or v == "" else v
          payload = {
              "API_BASE_URL": env("API_BASE_URL", "https://api.360ghar.com"),
              "SUPABASE_URL": env("SUPABASE_URL"),
              "SUPABASE_PUBLISHABLE_KEY": env("SUPABASE_PUBLISHABLE_KEY"),
              "GOOGLE_PLACES_API_KEY": env("GOOGLE_PLACES_API_KEY"),
              "GOOGLE_WEB_CLIENT_ID": env("GOOGLE_WEB_CLIENT_ID"),
              "GOOGLE_IOS_CLIENT_ID": env("GOOGLE_IOS_CLIENT_ID"),
              "DEBUG_MODE": "true",
              "LOG_API_CALLS": "false",
              "FIREBASE_ANALYTICS": "false",
              "FIREBASE_PERFORMANCE": "false",
              "FIREBASE_IAM": "false",
          }
          with open("dart_defines.json", "w", encoding="utf-8") as f:
              json.dump(payload, f)
          print("dart_defines.json written (values not printed)")
          PY

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | MAESTRO_VERSION=1.39.0 bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH
          $HOME/.maestro/bin/maestro --version

      - name: Boot iOS simulator
        run: |
          set -euo pipefail
          # Extract UDID only (previous sed left the whole device line when it
          # failed to match, which produces "Invalid device or device pair").
          UDID="$(
            xcrun simctl list devices available \
              | grep -i 'iphone' \
              | grep -vi 'unavailable' \
              | grep -m1 -Eo '[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}' \
            || true
          )"
          if [ -z "${UDID}" ]; then
            echo "No available iOS simulator found. Devices:" >&2
            xcrun simctl list devices available >&2 || true
            exit 1
          fi
          xcrun simctl boot "${UDID}" || true
          xcrun simctl bootstatus "${UDID}" -b
          echo "Booted simulator: ${UDID}"

      - name: Run Maestro iOS full suite
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          TEST_PHONE: ${{ secrets.TEST_PHONE }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: ./scripts/run_maestro_ci.sh ios full

      - name: Upload iOS Maestro artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-ios-artifacts
          path: |
            build/maestro
            ~/.maestro/tests
          if-no-files-found: warn
