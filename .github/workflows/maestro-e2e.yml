name: Maestro E2E Tests

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  maestro-android:
    name: Maestro Android E2E
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: 'stable'
          cache: true

      - name: Create environment files
        run: |-
          for ENV_FILE in ".env.development" ".env.production"; do
          echo -e "API_BASE_URL=${{ secrets.API_BASE_URL }}\nSUPABASE_URL=${{ secrets.SUPABASE_URL }}\nSUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}\nGOOGLE_PLACES_API_KEY=${{ secrets.GOOGLE_PLACES_API_KEY }}" > $ENV_FILE
          done

      - name: Install dependencies
        run: flutter pub get

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH
          $HOME/.maestro/bin/maestro --version

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Run Maestro on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          target: google_apis
          script: |
            adb install build/app/outputs/flutter-apk/app-debug.apk
            maestro test .maestro/ --format junit --output maestro-report.xml || true

      - name: Upload Maestro report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-android-report
          path: maestro-report.xml
          if-no-files-found: warn

  maestro-ios:
    name: Maestro iOS E2E
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: 'stable'
          cache: true

      - name: Create environment files
        run: |-
          for ENV_FILE in ".env.development" ".env.production"; do
          echo -e "API_BASE_URL=${{ secrets.API_BASE_URL }}\nSUPABASE_URL=${{ secrets.SUPABASE_URL }}\nSUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}\nGOOGLE_PLACES_API_KEY=${{ secrets.GOOGLE_PLACES_API_KEY }}" > $ENV_FILE
          done

      - name: Install dependencies
        run: flutter pub get

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH
          $HOME/.maestro/bin/maestro --version

      - name: Boot iOS simulator
        run: |
          UDID=$(xcrun simctl list devices available | grep -m1 "iPhone" | sed -E 's/.*\(([0-9A-F-]+)\) \(.*\)$/\1/')
          if [ -z "$UDID" ]; then
            echo "No available iOS simulator found" >&2
            exit 1
          fi
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          echo "Booted simulator: $UDID"

      - name: Build debug iOS
        run: flutter build ios --debug --no-codesign

      - name: Run Maestro on iOS simulator
        run: |
          if [ -f "./scripts/run_maestro_ci.sh" ]; then
            chmod +x ./scripts/run_maestro_ci.sh
            ./scripts/run_maestro_ci.sh ios full
          else
            maestro test .maestro/ --format junit --output maestro-ios-report.xml || true
          fi

      - name: Upload Maestro iOS report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-ios-report
          path: maestro-*-report.xml
          if-no-files-found: warn
