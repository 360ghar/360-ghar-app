name: Build Android APK

on:
  push:
    branches: [ main, develop, feature/**, bugfix/**, hotfix/** ]
  pull_request:
    branches: [ main, develop ]

# Grant the minimal permissions needed. The default GITHUB_TOKEN is read-only.
# We need write access to comment on PRs/issues.
permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create dart-define config (not packaged as assets)
      env:
        API_BASE_URL: ${{ secrets.API_BASE_URL }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
        DEFAULT_COUNTRY: ${{ secrets.DEFAULT_COUNTRY }}
        DEBUG_MODE: ${{ secrets.DEBUG_MODE }}
        LOG_API_CALLS: ${{ secrets.LOG_API_CALLS }}
        FIREBASE_ENABLED: ${{ secrets.FIREBASE_ENABLED }}
        FIREBASE_CRASHLYTICS: ${{ secrets.FIREBASE_CRASHLYTICS }}
        FIREBASE_ANALYTICS: ${{ secrets.FIREBASE_ANALYTICS }}
        FIREBASE_PERFORMANCE: ${{ secrets.FIREBASE_PERFORMANCE }}
        FIREBASE_IAM: ${{ secrets.FIREBASE_IAM }}
      run: |
        set -euo pipefail
        # Secrets are injected at compile time via --dart-define-from-file.
        # Do NOT write them into Flutter assets (extractable from APK/IPA).
        python3 - <<'PY'
        import json, os
        def env(key, default=""):
            v = os.environ.get(key)
            return default if v is None or v == "" else v
        payload = {
            "API_BASE_URL": env("API_BASE_URL", "https://api.360ghar.com"),
            "SUPABASE_URL": env("SUPABASE_URL"),
            "SUPABASE_PUBLISHABLE_KEY": env("SUPABASE_PUBLISHABLE_KEY"),
            "GOOGLE_PLACES_API_KEY": env("GOOGLE_PLACES_API_KEY"),
            "GOOGLE_WEB_CLIENT_ID": env("GOOGLE_WEB_CLIENT_ID"),
            "GOOGLE_IOS_CLIENT_ID": env("GOOGLE_IOS_CLIENT_ID"),
            "DEFAULT_COUNTRY": env("DEFAULT_COUNTRY", "in"),
            "DEBUG_MODE": env("DEBUG_MODE", "false"),
            "LOG_API_CALLS": env("LOG_API_CALLS", "false"),
            "FIREBASE_ENABLED": env("FIREBASE_ENABLED", "true"),
            "FIREBASE_CRASHLYTICS": env("FIREBASE_CRASHLYTICS", "true"),
            # Privacy-by-default unless secrets explicitly enable.
            "FIREBASE_ANALYTICS": env("FIREBASE_ANALYTICS", "false"),
            "FIREBASE_PERFORMANCE": env("FIREBASE_PERFORMANCE", "false"),
            "FIREBASE_IAM": env("FIREBASE_IAM", "false"),
        }
        with open("dart_defines.json", "w", encoding="utf-8") as f:
            json.dump(payload, f)
        print("dart_defines.json written (values not printed)")
        PY

    - name: Configure Firebase (optional)
      if: secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 != ''
      run: |
        set -euo pipefail
        printf '%s' "${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > android/app/google-services.json

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.44.6'
        channel: 'stable'
        cache: true

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Ensure Android SDK packages
      run: |
        set -euxo pipefail

        ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
        if [ -z "${ANDROID_SDK_ROOT}" ]; then
          echo "ANDROID_SDK_ROOT/ANDROID_HOME is not set" >&2
          exit 1
        fi

        SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
        if [ ! -x "${SDKMANAGER}" ]; then
          SDKMANAGER="$(command -v sdkmanager || true)"
        fi
        if [ -z "${SDKMANAGER}" ] || [ ! -x "${SDKMANAGER}" ]; then
          echo "sdkmanager not found" >&2
          exit 1
        fi

        yes | "${SDKMANAGER}" --licenses >/dev/null

        if [ ! -d "${ANDROID_SDK_ROOT}/platforms/android-36" ]; then
          "${SDKMANAGER}" "platforms;android-36"
        fi

    - name: Capture Flutter/Dart versions
      id: versions
      run: |
        echo "flutter_version=$(flutter --version | head -n1)" >> $GITHUB_OUTPUT
        echo "dart_version=$(dart --version 2>&1)" >> $GITHUB_OUTPUT

    - name: Verify Flutter and Dart versions
      run: |
        echo "Flutter version: $(flutter --version)"
        echo "Dart version: $(dart --version)"
        dart_version=$(dart --version 2>&1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
        echo "Dart version extracted: $dart_version"

        # Check if Dart version is >= 3.12.0
        if [ "$(printf '%s\n' "$dart_version" "3.12.0" | sort -V | head -n1)" = "3.12.0" ]; then
          echo "✅ Dart version $dart_version is compatible (≥3.12.0)"
        else
          echo "❌ Dart version $dart_version is incompatible (<3.12.0)"
          exit 1
        fi

    - name: Get Flutter dependencies
      run: flutter pub get

    - name: Build APK
      run: >
        flutter build apk --release
        --target-platform android-arm,android-arm64,android-x64
        --dart-define-from-file=dart_defines.json

    - name: Rename APK to 360ghar.apk
      run: |
        set -euxo pipefail
        src="build/app/outputs/flutter-apk/app-release.apk"
        dest="build/app/outputs/flutter-apk/360ghar.apk"
        if [ -f "$src" ]; then
          mv "$src" "$dest"
          echo "Renamed APK to $dest"
        else
          echo "APK not found at $src" >&2
          exit 1
        fi

    - name: Generate artifact name
      id: artifact-name
      run: |
        if [[ "${{ github.ref }}" == "refs/heads/main" || "${{ github.base_ref }}" == "main" ]]; then
          # For main branch and PRs targeting main, include timestamp for uniqueness
          echo "name=ghar360-main-${{ github.run_id }}-${{ github.run_attempt }}" >> $GITHUB_OUTPUT
          echo "retention_days=30" >> $GITHUB_OUTPUT
        else
          # For other branches, use branch name for consistent artifact name (overwrites previous)
          BRANCH_NAME=$(echo "${{ github.head_ref || github.ref_name }}" | sed 's/[^a-zA-Z0-9._-]/-/g')
          echo "name=ghar360-${BRANCH_NAME}" >> $GITHUB_OUTPUT
          echo "retention_days=1" >> $GITHUB_OUTPUT
        fi

    - name: Upload APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.artifact-name.outputs.name }}
        path: build/app/outputs/flutter-apk/360ghar.apk
        retention-days: ${{ steps.artifact-name.outputs.retention_days }}
        if-no-files-found: error

    - name: Upload mapping file (if exists)
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.artifact-name.outputs.name }}-mapping
        path: build/app/outputs/mapping/release/mapping.txt
        retention-days: ${{ steps.artifact-name.outputs.retention_days }}
        if-no-files-found: warn

    - name: Comment on PR with build status
      # Skip for PRs from forks (GITHUB_TOKEN cannot write to upstream repo from forks)
      if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      uses: actions/github-script@v7
      with:
        github-token: ${{ github.token }}
        script: |
          const artifactName = '${{ steps.artifact-name.outputs.name }}';
          const runId = '${{ github.run_id }}';

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `🤖 **Android APK Build Complete!**\n\n` +
                  `📱 **Download APK**: [${artifactName}.apk](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId})\n\n` +
                  `📋 **Build Details:**\n` +
                  `- Branch: \`${context.payload.pull_request.head.ref}\`\n` +
                  `- Commit: \`${context.sha.substring(0, 7)}\`\n` +
                  `- ${process.env['FLUTTER_VERSION'] || `${{ steps.versions.outputs.flutter_version }}`}\n` +
                  `- ${process.env['DART_VERSION'] || `${{ steps.versions.outputs.dart_version }}`}\n\n` +
                  `💡 *The APK will be available for download from the Artifacts section above.*`
          });
